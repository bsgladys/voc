<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksklusif Offer - Beli Sama Gladys</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #09090b;
            background-image: 
                radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f4f4f5;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* Top Brand Avatar & Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f43f5e, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
            color: white;
            font-size: 1.5rem;
        }

        .brand-name {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fda4af;
        }

        /* Main Floating Card */
        .card {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f43f5e, #a855f7, #3b82f6);
        }

        /* Greeting Section */
        .user-greeting {
            margin-bottom: 20px;
        }

        .user-greeting p {
            font-size: 0.85rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .user-greeting h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
        }

        .highlight-name {
            background: linear-gradient(135deg, #fb7185, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: capitalize;
        }

        /* Reward Box Highlight */
        .reward-card {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .reward-badge {
            display: inline-block;
            background: #f43f5e;
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .reward-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .reward-sub {
            font-size: 0.85rem;
            color: #d4d4d8;
            line-height: 1.4;
        }

        /* Coupon Code Box */
        .code-container {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .code-details {
            text-align: left;
        }

        .code-label {
            font-size: 0.65rem;
            color: #71717a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }

        .code-text {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #f4f4f5;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: #f43f5e;
            border-color: #f43f5e;
            color: white;
        }

        /* Action Link */
        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(16, 185, 129, 0.5);
        }

        .expiry-note {
            text-align: center;
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Header Brand -->
    <div class="brand-header">
        <div class="avatar-box">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="brand-name">Beli Sama Gladys</div>
    </div>

    <!-- Main Card -->
    <div class="card">
        <div class="user-greeting">
            <p>Special Offer For You</p>
            <h1>Halo kak <span id="userName" class="highlight-name">Pelanggan Setia</span>! ✨</h1>
        </div>

        <div class="reward-card">
            <span class="reward-badge">Voucher Eksklusif</span>
            <div class="reward-title">Potongan 50K</div>
            <p class="reward-sub">Dengan minimal pembelian 150k.</p>
        </div>

        <!-- Voucher Code Box -->
        <div class="code-container">
            <div class="code-details">
                <span class="code-label">Kode Voucher</span>
                <span id="voucherCode" class="code-text">GLADYS50K</span>
            </div>
            <button class="copy-btn" onclick="copyCode()">
                <i class="fa-regular fa-copy"></i> Salin
            </button>
        </div>

        <!-- CTA WhatsApp Button -->
        <a id="waBtn" href="#" target="_blank" class="cta-button">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Klaim Promo via WhatsApp
        </a>

        <div class="expiry-note">
            <i class="fa-regular fa-clock"></i> Berlaku hingga 30 September 2026
        </div>
    </div>
</div>

<script>
    // 1. Tangkap parameter URL ?nama=...
    const urlParams = new URLSearchParams(window.location.search);
    const namaParam = urlParams.get('nama');
    const nameTarget = document.getElementById('userName');

    if (namaParam && namaParam.trim() !== "") {
        nameTarget.textContent = namaParam.trim();
    }

    // 2. Setup Pesan Otomatis WhatsApp
    const kodeVoucher = "GLADYS50K";
    const namaPelanggan = nameTarget.textContent;
    const nomorWA = "6285181676701"; // Ganti dengan nomor WhatsApp Beli Sama Gladys
    
    const pesan = `Hai Gladys, saya ${namaPelanggan}. Mau klaim voucher diskon (${kodeVoucher}).`;
    
    document.getElementById('waBtn').href = `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;

    // 3. Fitur Salin Kode
    function copyCode() {
        const code = document.getElementById('voucherCode').innerText;
        navigator.clipboard.writeText(code).then(() => {
            alert('Kode voucher ' + code + ' berhasil disalin!');
        });
    }
</script>

</body>
</html>
